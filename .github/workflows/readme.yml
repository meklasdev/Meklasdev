
name: Odśwież README

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pobierz README z meklasdev.me
        run: curl -sfS --retry 3 --retry-delay 5 "https://meklasdev.me/readme.php" -o README.md

      - name: Commit, jeśli się zmieniło
        run: |
          if ! git diff --quiet -- README.md; then
            git config user.name "readme-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: odśwież README z meklasdev.me"
            git push
          else
            echo "Bez zmian."
          fi
